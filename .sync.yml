---
".gitlab-ci.yml":
  delete: true
".rubocop.yml":
  include_todos: true
  # cop settings the module set by hand (MODULES-11997 pdk update)
  cop_overrides:
    Style/HashSyntax:
      Enabled: false
appveyor.yml:
  delete: true

Gemfile:
  optional:
    ":development":
    - gem: ruby-pwsh
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
  spec_overrides:
  - def regexp_matches(available_parameters)
  - "  match(available_parameters)"
  - end
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: true
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '5 1 * * *'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
Rakefile:
  # puppet-lint checks the module disabled by hand (Rakefile/.puppet-lint.rc) (MODULES-11997 pdk update)
  extra_disabled_lint_checks:
  - anchor_resource
  - strict_indent
